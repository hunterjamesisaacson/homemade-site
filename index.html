<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homemade</title>
<meta name="description" content="Homemade — make it yourself.">
<link rel="icon" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    color: #101828;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 56px 24px;
    text-align: center;
  }

  h1 {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .phone {
    width: 240px;
    aspect-ratio: 9 / 19.5;
    border-radius: 38px;
    border: 8px solid #111;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 12px 40px rgba(16, 24, 40, 0.14);
  }

  .phone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .cta {
    display: inline-block;
    background: #A86421;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    padding: 15px 30px;
    border-radius: 999px;
  }

  footer {
    font-size: 13px;
    color: #98a2b3;
  }
</style>
</head>
<body>

  <h1>Homemade</h1>

  <div class="phone">
    <img src="phone-wood-light.png" alt="">
  </div>

  <a class="cta" href="#">Coming soon on iOS</a>

  <footer>&copy; 2026 Homemade Labs, LLC</footer>

</body>
</html>
