<!-- Amplitude Browser SDK 2, loaded before the redirect script so the
     landing event goes out ahead of the jump. If the CDN is blocked the
     redirect still runs: every amplitude call below is guarded. -->
<script src="https://cdn.amplitude.com/libs/analytics-browser-2.49.1-min.js.gz"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    color: #101828;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  @keyframes logoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .spinning-logo { animation: none; } }

  .logo-link { margin-top: auto; }

  .spinning-logo {
    height: 64px;
    width: 64px;
    border-radius: 14px;
    animation: logoSpin 16s linear infinite;
    display: block;
  }

  h1 {
    margin: 24px 0 8px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .tagline {
    margin: 0 0 24px;
    color: #666;
    max-width: 320px;
    line-height: 1.5;
  }

  .eyebrow {
    margin: 0 0 8px;
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .marquee {
    width: 100%;
    overflow: hidden;
    margin-bottom: 24px;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
  }

  .marquee-track {
    display: flex;
    gap: 8px;
    width: max-content;
    animation: marquee 35s linear infinite;
  }

  .pill {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #ddd;
    background: #fff;
    font-size: 13px;
    white-space: nowrap;
  }

  .rating {
    margin: 0 0 10px;
    font-size: 14px;
    color: #444;
  }

  .stars { color: #f5a623; letter-spacing: 1px; }

  .badge-link { text-decoration: none; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #000;
    color: #fff;
    border-radius: 12px;
    padding: 10px 24px;
  }

  .badge svg {
    width: 36px;
    height: 36px;
    fill: currentColor;
  }

  .badge-text { text-align: left; line-height: 1.15; }
  .badge-small { display: block; font-size: 11px; letter-spacing: 0.3px; }
  .badge-big { display: block; font-size: 21px; font-weight: 600; }

  .refresh {
    margin-top: 12px;
    font-size: 13px;
    color: #999;
  }

  .refresh span {
    color: #666;
    text-decoration: underline;
    cursor: pointer;
  }

  .contact {
    margin-top: auto;
    font-size: 13px;
    color: #666;
  }
</style>
</head>
<body>

  <a class="logo-link" href="https://apps.apple.com/us/app/homemade-non-toxic-recipes/id6811146921" data-store-link>
    <img class="spinning-logo" src="/icon-h-512.png" alt="Homemade - Non-toxic recipes">
  </a>

  <h1>Get Homemade</h1>
  <p class="tagline">Make your own soap, cleaners, skincare and more with simple recipes that leave out the hidden chemicals.</p>

  <p class="eyebrow">20+ categories</p>
  <div class="marquee">
    <div class="marquee-track" id="marquee"></div>
  </div>

  <p class="rating" id="rating"><span class="stars">★★★★★</span> <strong>5.0</strong> on the App Store</p>

  <a class="badge-link" href="https://apps.apple.com/us/app/homemade-non-toxic-recipes/id6811146921" data-store-link>
    <span class="badge">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
      <span class="badge-text">
        <span class="badge-small" id="badge-small">Download on the</span>
        <span class="badge-big" id="badge-big">App Store</span>
      </span>
    </span>
  </a>

  <p class="refresh">Button not working? <span id="refresh">Refresh</span></p>

  <a class="contact" href="/support/">Contact us</a>

<script>
// Copied from Localize's /app page (localize-cms src/pages/AppDownload) and
// retrofitted for Homemade: same jumps, same two Amplitude events, same
// fallback. The page exists because TikTok, Instagram and Facebook block or
// swallow a raw apps.apple.com link in their in-app browsers.
(function () {
  var APP_STORE_URL = "https://apps.apple.com/us/app/homemade-non-toxic-recipes/id6811146921";
  // itms-apps opens the App Store app directly, which works from inside
  // in-app browsers where a plain https redirect can be swallowed
  var APP_STORE_DIRECT_URL = "itms-apps://apps.apple.com/us/app/homemade-non-toxic-recipes/id6811146921";
  // Amplitude's client key for the Homemade project (public by design; it
  // can only send events). Same key the app uses (services/analytics.js).
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.hi.homemade&pcampaignid=web_share";
  var ANDROID_ICON_PATH = "M18.4395 5.5586c-.675 1.1664-1.352 2.3318-2.0274 3.498-.0366-.0155-.0742-.0286-.1113-.043-1.8249-.6957-3.484-.8-4.42-.787-1.8551.0185-3.3544.4643-4.2597.8203-.084-.1494-1.7526-3.021-2.0215-3.4864a1.1451 1.1451 0 0 0-.1406-.1914c-.3312-.364-.9054-.4859-1.379-.203-.475.282-.7136.9361-.3886 1.5019 1.9466 3.3696-.0966-.2158 1.9473 3.3593.0172.031-.4946.2642-1.3926 1.0177C2.8987 12.176.452 14.772 0 18.9902h24c-.119-1.1108-.3686-2.099-.7461-3.0683-.7438-1.9118-1.8435-3.2928-2.7402-4.1836a12.1048 12.1048 0 0 0-2.1309-1.6875c.6594-1.122 1.312-2.2559 1.9649-3.3848.2077-.3615.1886-.7956-.0079-1.1191a1.1001 1.1001 0 0 0-.8515-.5332c-.5225-.0536-.9392.3128-1.0488.5449zm-.0391 8.461c.3944.5926.324 1.3306-.1563 1.6503-.4799.3197-1.188.0985-1.582-.4941-.3944-.5927-.324-1.3307.1563-1.6504.4727-.315 1.1812-.1086 1.582.4941zM7.207 13.5273c.4803.3197.5506 1.0577.1563 1.6504-.394.5926-1.1038.8138-1.584.4941-.48-.3197-.5503-1.0577-.1563-1.6504.4008-.6021 1.1087-.8106 1.584-.4941z";
  var AMPLITUDE_API_KEY = "8dee1de144f2f032c27b083ec2321bfb";

  // mirrors the shelf in the app (data/catalog.seed.json shelfLabel, same order)
  var CATEGORIES = [
    "🧽 Cleaning", "🦷 Mouth & Teeth", "🪒 Grooming", "🧼 Soap", "🛁 Bath & Body",
    "💇 Hair Care", "🧴 Skincare", "🌿 Deodorant", "🌸 Fragrance", "☀️ Suncare",
    "💄 Makeup", "🌱 Garden", "🐾 Pet Care", "👶 Baby", "🚗 Automotive",
    "🕯️ Candles", "🐜 Bugs & Pests", "🍵 Remedies", "🥫 Condiments", "🍓 Jams", "🥜 Spreads"
  ];

  var track = document.getElementById("marquee");
  var doubled = CATEGORIES.concat(CATEGORIES);
  for (var i = 0; i < doubled.length; i++) {
    var pill = document.createElement("span");
    pill.className = "pill";
    pill.textContent = doubled[i];
    track.appendChild(pill);
  }

  var amp = window.amplitude;
  function ampCall(fn) {
    if (!amp) return;
    try { fn(); } catch (e) {}
  }
  // autocapture off so the Homemade project only gets the two events below,
  // the same two Localize's page sends. init is async in SDK 2: track and
  // flush run after its promise, or the flush is a no-op. Remote config off:
  // nothing here uses it and waiting on its fetch lost events before the jump.
  var ampReady = null;
  ampCall(function () {
    ampReady = amp.init(AMPLITUDE_API_KEY, { autocapture: false, fetchRemoteConfig: false }).promise;
  });

  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isInstagram = /Instagram/i.test(ua);
  var isFacebook = /FBAN|FBAV|FB_IAB/i.test(ua);
  // TikTok's webview; labelled for the analytics, jumps like Safari
  var isTikTok = /musical_ly|BytedanceWebview|TikTok/i.test(ua);

  var browser = isInstagram ? "instagram"
    : isFacebook ? "facebook"
    : isTikTok ? "tiktok"
    : isIOS ? "safari"
    : isAndroid ? "android"
    : "other";
  var method = !isIOS ? "https"
    : isInstagram ? "extbrowser"
    : isFacebook ? "x-safari"
    : "itms";

  var outcomeSent = false;
  // one Result event per landing: "auto" when the page gets left without a
  // tap (a jump worked), "manual" when the user has to tap the badge
  function reportOutcome(outcome) {
    if (outcomeSent) return;
    outcomeSent = true;
    ampCall(function () {
      ampReady.then(function () {
        amp.track("App Redirect Result", { outcome: outcome, browser: browser, route: "/app" });
        // send now by beacon: iOS pauses the batch timer once the App Store is in front
        amp.flush();
      });
    });
  }

  // IG/FB suppress tapped store links inside their webviews too, so taps
  // must go through the same escape schemes as the auto-redirect
  function handleStoreClick(e) {
    reportOutcome("manual");
    if (isInstagram) {
      e.preventDefault();
      window.location.href = "instagram://extbrowser/?url=" + encodeURIComponent(APP_STORE_URL);
    } else if (isFacebook) {
      e.preventDefault();
      window.open("x-safari-" + APP_STORE_URL, "_blank");
    }
  }
  var links = document.querySelectorAll("[data-store-link]");
  for (var j = 0; j < links.length; j++) {
    // Android phones get the Google Play listing on every link and badge
    if (isAndroid) links[j].href = PLAY_STORE_URL;
    else links[j].addEventListener("click", handleStoreClick);
  }
  if (isAndroid) {
    document.getElementById("badge-small").textContent = "GET IT ON";
    document.getElementById("badge-big").textContent = "Google Play";
    document.querySelector(".badge svg path").setAttribute("d", ANDROID_ICON_PATH);
    // the 5.0 rating is the App Store's, so don't show it on Android
    document.getElementById("rating").style.display = "none";
  }
  document.getElementById("refresh").addEventListener("click", function () { window.location.reload(); });

  // beacon transport survives the redirect below
  var landingSent = Promise.resolve();
  ampCall(function () {
    landingSent = ampReady.then(function () {
      amp.setTransport("beacon");
      amp.track("App Redirect", { browser: browser, method: method, route: "/app", referrer: document.referrer });
      // send now by beacon: iOS pauses the batch timer once the App Store is in front
      return amp.flush().promise;
    });
  });

  // leaving the page within 6s of landing without having tapped the badge
  // means a redirect fired on its own
  var landedAt = Date.now();
  function onLeave() {
    if (Date.now() - landedAt < 6000) reportOutcome("auto");
  }
  window.addEventListener("pagehide", onLeave);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") onLeave();
  });

  // Android goes to Google Play; computers and everything else to the App Store
  if (!isIOS) {
    // jump once the landing beacon is queued, or after 400ms, whichever first;
    // at once if the SDK never loaded
    var jumped = false;
    var jump = function () {
      if (jumped) return;
      jumped = true;
      window.location.replace(isAndroid ? PLAY_STORE_URL : APP_STORE_URL);
    };
    landingSent.then(jump, jump);
    setTimeout(jump, 400);
    return;
  }

  if (isInstagram) {
    // IG blocks store-bound JS navigation, but handles its own extbrowser
    // scheme: it kicks the URL out to real Safari, which hands
    // apps.apple.com to the native App Store
    window.location.href = "instagram://extbrowser/?url=" + encodeURIComponent(APP_STORE_URL);
  } else if (isFacebook) {
    // FB's webview doesn't support extbrowser; x-safari- still works there
    window.open("x-safari-" + APP_STORE_URL, "_blank");
  } else {
    window.location.href = APP_STORE_DIRECT_URL;
  }

  // If none of the jumps fired and this page is still visible,
  // fall back to the https listing
  setTimeout(function () {
    if (!document.hidden) window.location.replace(APP_STORE_URL);
  }, 1500);
})();
</script>
